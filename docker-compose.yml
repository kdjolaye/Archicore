services:

  mysql:
    image: mysql:8.4
    container_name: audit_monolith_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: audit_monolith_db
      MYSQL_USER: klaye
      MYSQL_PASSWORD: klaye2026
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - monolith_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  monolith-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: monolith_app_final
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/audit_monolith_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: klaye
      SPRING_DATASOURCE_PASSWORD: klaye2026
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_PROFILES_ACTIVE: dev
      FILE_ROOT_LOCATION: /data/storage
      # JWT
      JWT_SECRET: bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU2VydmljZTIwMjZLbGF5ZQ==
      JWT_EXPIRATION: 900000          # ✅ 15 min au lieu de 1h
      JWT_REFRESH_EXPIRATION: 604800000  # ✅ À ajouter — 7 jours pour le refresh token
    volumes:
      - document_storage:/data/storage
    networks:
      - monolith_network
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
    driver: local
  document_storage:
    driver: local

networks:
  monolith_network:
    driver: bridge