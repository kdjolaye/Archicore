server:
  port: ${APP_PORT:8080}

spring:
  application:
    name: monolith-app
  main:
    allow-bean-definition-overriding: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/audit_monolith_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Upload de fichiers
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 25MB

# Configuration JWT (Centralisée)
jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uU2VydmljZTIwMjZLbGF5ZQ==}
  expiration: ${JWT_EXPIRATION:900000}                       # ✅ 15 min
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}    # ✅ 7 jours à ajouter

# Configuration du stockage des fichiers
file:
  root-location: ${FILE_ROOT_LOCATION:./storage}
  max-size-mb: 20
  allowed-types:
    - application/pdf
    - application/msword
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.ms-excel
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - image/jpeg
    - image/png

# Logging
logging:
  level:
    com.klaye.monolith: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
